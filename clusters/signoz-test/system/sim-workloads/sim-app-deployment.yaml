---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-app
  namespace: obs-sim
  labels:
    app: sim-app
    app.kubernetes.io/part-of: obs-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-app
  template:
    metadata:
      labels:
        app: sim-app
        app.kubernetes.io/part-of: obs-sim
      annotations:
        # Opt in to SigNoz scrape-based metrics if you add a Prometheus receiver
        prometheus.io/scrape: "false"
    spec:
      containers:
      - name: sim-app
        # Uses python:3.12-slim + installs redis client at startup via entrypoint.sh.
        # No custom image build required.  For a faster startup, build and push
        # the image from dummy-sim-workloads/Dockerfile and override this value.
        image: python:3.12-slim
        command: ["/bin/sh", "/scripts/entrypoint.sh"]
        env:
        - name: SERVICE_NAME
          value: "sim-app"
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: REDIS_HOST
          value: "redis-db.obs-sim.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: LOOP_INTERVAL_SEC
          value: "2.0"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        # Allow up to 30s for pip install redis to complete before failing.
        startupProbe:
          exec:
            command: [python, -c, "import sys; sys.exit(0)"]
          failureThreshold: 6
          periodSeconds: 5
      volumes:
      - name: scripts
        configMap:
          name: sim-app-scripts
          defaultMode: 0755
