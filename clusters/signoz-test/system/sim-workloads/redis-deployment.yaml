---
# Redis "database" pod – stdout logs collected by the OTel filelog daemonset
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-db
  namespace: obs-sim
  labels:
    app: redis-db
    app.kubernetes.io/part-of: obs-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-db
  template:
    metadata:
      labels:
        app: redis-db
        app.kubernetes.io/part-of: obs-sim
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args:
        - redis-server
        - --loglevel
        - notice
        - --save
        - ""          # disable RDB persistence – this is a sim, not storage
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        resources:
          requests:
            cpu: 30m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        livenessProbe:
          exec:
            command: [redis-cli, ping]
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          exec:
            command: [redis-cli, ping]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis-db
  namespace: obs-sim
  labels:
    app: redis-db
    app.kubernetes.io/part-of: obs-sim
spec:
  selector:
    app: redis-db
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
