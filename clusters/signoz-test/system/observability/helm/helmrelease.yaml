apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: otel-collector-ds
  namespace: signoz-test
spec:
  interval: 1m
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.158.0
      sourceRef:
        kind: HelmRepository
        name: otel-collector-repo-ds
  valuesFrom:
    - kind: ConfigMap
      name: otel-collector-values