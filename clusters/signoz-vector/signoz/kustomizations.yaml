apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: signoz-vector-kustomization
namespace: signoz-vector
resources:
- ./helm/helmrepo.yaml
- ./helm/helmrelease.yaml
configMapGenerator:
- name: signoz-values
  files:
  - values.yaml=signoz.yaml
  options:
    disableNameSuffixHash: true
