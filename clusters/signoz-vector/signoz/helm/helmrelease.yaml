apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: signoz
  namespace: signoz-vector
spec:
  interval: 1m
  timeout: 10m0s
  chart:
    spec:
      chart: signoz
      version: 0.110.0
      sourceRef:
        kind: HelmRepository
        name: signoz-repo
  valuesFrom:
    - kind: ConfigMap
      name: signoz-values