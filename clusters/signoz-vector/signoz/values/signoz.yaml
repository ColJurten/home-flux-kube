global:
  imageRegistry: &GLOBAL_IMAGE_REGISTRY null

k8s-infra:
  enabled: false  # We're using Vector instead

clickhouse:
  installCustomStorageClass: false

  image:
    registry:  *GLOBAL_IMAGE_REGISTRY
    repository: clickhouse/clickhouse-server
    tag: 24.1.2-alpine

zookeeper:
  image:
    registry:  *GLOBAL_IMAGE_REGISTRY
    repository: signoz/zookeeper
    tag: 3.7.2
  auth:
    enabled: false
  allowAnonymousLogin: true

otelCollector:
enabled: true  
imagePullSecrets:
  - jfrog-docker-creds
image:
  registry:  *GLOBAL_IMAGE_REGISTRY

queryService:

  image:
    registry:  *GLOBAL_IMAGE_REGISTRY
  initContainers:
    init:
      image:
        registry:  *GLOBAL_IMAGE_REGISTRY
        repository: busybox
        tag: 1.35



schemaMigrator:

  image:
    registry:  *GLOBAL_IMAGE_REGISTRY
initContainers:
  init:
    image:
      registry:  *GLOBAL_IMAGE_REGISTRY
      repository: busybox
      tag: 1.35

  wait:
    image:
      registry:  *GLOBAL_IMAGE_REGISTRY
      repository: groundnuty/k8s-wait-for
      tag: v2.0

  