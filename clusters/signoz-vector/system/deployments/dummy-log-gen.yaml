# OpenTelemetry Correlated Telemetry Generator
# Single container generating CORRELATED logs, traces, and metrics
# Logs contain trace_id/span_id for correlation in SigNoz
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-generator-script
  namespace: signoz-vector
data:
  generator.py: |
    #!/usr/bin/env python3
    import sys
    print("Script starting...", flush=True)
    
    try:
        import time
        import random
        import logging
        import os
        print("Standard imports OK", flush=True)
        
        from opentelemetry import trace, metrics
        from opentelemetry.sdk.trace import TracerProvider
        from opentelemetry.sdk.trace.export import BatchSpanProcessor
        from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
        from opentelemetry.sdk.metrics import MeterProvider
        from opentelemetry.sdk.metrics.export import PeriodicExportingMetricReader
        from opentelemetry.exporter.otlp.proto.grpc.metric_exporter import OTLPMetricExporter
        from opentelemetry.sdk._logs import LoggerProvider, LoggingHandler
        from opentelemetry.sdk._logs.export import BatchLogRecordProcessor
        from opentelemetry.exporter.otlp.proto.grpc._log_exporter import OTLPLogExporter
        from opentelemetry.sdk.resources import Resource
        from opentelemetry._logs import set_logger_provider
        print("OpenTelemetry imports OK", flush=True)
    except ImportError as e:
        print(f"Import error: {e}", flush=True)
        sys.exit(1)

    # =============================================================================
    # USER CONFIGURATION - Modify these variables as needed
    # =============================================================================
    
    # Service identification
    SERVICE_NAME = os.getenv("SERVICE_NAME", "demo-service")
    SERVICE_VERSION = os.getenv("SERVICE_VERSION", "1.0.0")
    ENVIRONMENT = os.getenv("ENVIRONMENT", "dev")
    K8S_NAMESPACE = os.getenv("K8S_NAMESPACE", "signoz-vector")
    K8S_POD_NAME = os.getenv("POD_NAME", "unknown")
    K8S_POD_UID = os.getenv("POD_UID", "unknown")
    K8S_NODE_NAME = os.getenv("NODE_NAME", "unknown")
    
    # OTEL Collector endpoint
    OTEL_ENDPOINT = os.getenv("OTEL_ENDPOINT", "otel-collector:4317")
    
    # Telemetry generation rates
    REQUEST_INTERVAL_SEC = float(os.getenv("REQUEST_INTERVAL_SEC", "0.5"))
    METRICS_EXPORT_INTERVAL_MS = int(os.getenv("METRICS_EXPORT_INTERVAL_MS", "5000"))
    
    # Simulated request parameters
    MIN_DURATION_MS = int(os.getenv("MIN_DURATION_MS", "10"))
    MAX_DURATION_MS = int(os.getenv("MAX_DURATION_MS", "500"))
    
    # Status code distribution (weights for 200, 201, 400, 500)
    STATUS_WEIGHTS = [70, 15, 10, 5]
    
    # API operations to simulate
    OPERATIONS = [
        "GET /api/users",
        "POST /api/orders", 
        "GET /api/products",
        "DELETE /api/cart",
        "PUT /api/users/{id}",
        "GET /api/health",
    ]
    
    # =============================================================================
    # END USER CONFIGURATION
    # =============================================================================

    print(f"Configuration loaded: SERVICE_NAME={SERVICE_NAME}, OTEL_ENDPOINT={OTEL_ENDPOINT}", flush=True)

    # Resource attributes for correlation (includes k8s pod info for SigNoz)
    resource = Resource.create({
        "service.name": SERVICE_NAME,
        "service.version": SERVICE_VERSION,
        "k8s.namespace.name": K8S_NAMESPACE,
        "k8s.pod.name": K8S_POD_NAME,
        "k8s.pod.uid": K8S_POD_UID,
        "k8s.node.name": K8S_NODE_NAME,
        "deployment.environment": ENVIRONMENT,
    })

    # Setup Tracing FIRST (required for exemplars)
    print("Setting up tracing...", flush=True)
    trace_provider = TracerProvider(resource=resource)
    trace_provider.add_span_processor(
        BatchSpanProcessor(OTLPSpanExporter(endpoint=OTEL_ENDPOINT, insecure=True))
    )
    trace.set_tracer_provider(trace_provider)
    tracer = trace.get_tracer(SERVICE_NAME)

    # Setup Metrics with Exemplars enabled
    print("Setting up metrics...", flush=True)
    metric_exporter = OTLPMetricExporter(endpoint=OTEL_ENDPOINT, insecure=True)
    metric_reader = PeriodicExportingMetricReader(
        metric_exporter,
        export_interval_millis=METRICS_EXPORT_INTERVAL_MS
    )
    
    meter_provider = MeterProvider(
        resource=resource,
        metric_readers=[metric_reader]
    )
    metrics.set_meter_provider(meter_provider)
    meter = metrics.get_meter(SERVICE_NAME)

    # Create metrics
    request_counter = meter.create_counter(
        f"{SERVICE_NAME.replace('-', '_')}_requests_total",
        description="Total requests processed"
    )
    request_duration = meter.create_histogram(
        f"{SERVICE_NAME.replace('-', '_')}_request_duration_ms",
        description="Request duration in milliseconds",
        unit="ms"
    )
    error_counter = meter.create_counter(
        f"{SERVICE_NAME.replace('-', '_')}_errors_total",
        description="Total errors encountered"
    )

    # Setup Logging with trace context injection
    print("Setting up logging...", flush=True)
    logger_provider = LoggerProvider(resource=resource)
    logger_provider.add_log_record_processor(
        BatchLogRecordProcessor(OTLPLogExporter(endpoint=OTEL_ENDPOINT, insecure=True))
    )
    set_logger_provider(logger_provider)
    handler = LoggingHandler(level=logging.INFO, logger_provider=logger_provider)
    logging.basicConfig(level=logging.INFO, handlers=[handler])
    logger = logging.getLogger(SERVICE_NAME)

    print(f"========================================", flush=True)
    print(f"Correlated Telemetry Generator Started", flush=True)
    print(f"========================================", flush=True)
    print(f"  Service: {SERVICE_NAME} v{SERVICE_VERSION}", flush=True)
    print(f"  Environment: {ENVIRONMENT}", flush=True)
    print(f"  Namespace: {K8S_NAMESPACE}", flush=True)
    print(f"  OTEL Endpoint: {OTEL_ENDPOINT}", flush=True)
    print(f"  Request Interval: {REQUEST_INTERVAL_SEC}s", flush=True)
    print(f"  Exemplars: ENABLED (metrics linked to traces)", flush=True)
    print(f"========================================", flush=True)
    print(f"", flush=True)
    print(f"To view correlated telemetry in SigNoz:", flush=True)
    print(f"  1. Services -> demo-service (APM view with traces+metrics)", flush=True)
    print(f"  2. Traces -> Filter by service.name=demo-service", flush=True)
    print(f"  3. Logs -> Filter by service.name=demo-service", flush=True)
    print(f"  4. Click any trace -> Related Logs tab shows correlated logs", flush=True)
    print(f"  5. Dashboards -> Create custom dashboard for metrics", flush=True)
    print(f"========================================", flush=True)
    
    request_count = 0
    while True:
        try:
            operation = random.choice(OPERATIONS)
            method, path = operation.split(" ", 1)
            duration = random.randint(MIN_DURATION_MS, MAX_DURATION_MS)
            status = random.choices([200, 201, 400, 500], weights=STATUS_WEIGHTS)[0]
            
            # Create a trace span - metrics recorded within span will have exemplars
            with tracer.start_as_current_span(operation) as span:
                # Get current trace context for correlation
                span_context = span.get_span_context()
                trace_id = format(span_context.trace_id, '032x')
                span_id = format(span_context.span_id, '016x')
                
                span.set_attribute("http.method", method)
                span.set_attribute("http.url", path)
                span.set_attribute("http.status_code", status)
                span.set_attribute("duration_ms", duration)
                span.set_attribute("service.name", SERVICE_NAME)
                span.set_attribute("deployment.environment", ENVIRONMENT)
                
                # Log within trace context - trace_id/span_id auto-injected
                if status >= 500:
                    logger.error(f"Request failed: {operation} - status={status} duration={duration}ms")
                    error_counter.add(1, {"operation": operation, "error_type": "server_error"})
                    span.set_status(trace.StatusCode.ERROR, "Server error")
                elif status >= 400:
                    logger.warning(f"Client error: {operation} - status={status} duration={duration}ms")
                    error_counter.add(1, {"operation": operation, "error_type": "client_error"})
                else:
                    logger.info(f"Request handled: {operation} - status={status} duration={duration}ms")
                
                # Simulate work
                time.sleep(duration / 1000)
                
                # Record metrics WITHIN the span context - this enables exemplars
                request_counter.add(1, {"operation": operation, "status": str(status), "method": method})
                request_duration.record(duration, {"operation": operation, "method": method})
            
            request_count += 1
            if request_count % 10 == 0:
                print(f"Generated {request_count} requests (last: {operation} trace_id={trace_id[:16]}...)", flush=True)
            
            time.sleep(REQUEST_INTERVAL_SEC)
        except Exception as e:
            print(f"Error in main loop: {e}", flush=True)
            time.sleep(1)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-telemetrygen
  namespace: signoz-vector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-telemetrygen
  template:
    metadata:
      labels:
        app: otel-telemetrygen
    spec:
      containers:
      - name: generator
        image: python:3.11-slim
        command: ["sh", "-c"]
        args:
          - |
            pip install --quiet opentelemetry-api opentelemetry-sdk \
              opentelemetry-exporter-otlp-proto-grpc && \
            python -u /scripts/generator.py
        env:
        # Ensure unbuffered Python output
        - name: PYTHONUNBUFFERED
          value: "1"
        # Pod metadata for correlation
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # Override these environment variables to customize the generator
        - name: SERVICE_NAME
          value: "demo-service"
        - name: SERVICE_VERSION
          value: "1.0.0"
        - name: ENVIRONMENT
          value: "dev"
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OTEL_ENDPOINT
          value: "otel-collector:4317"
        - name: REQUEST_INTERVAL_SEC
          value: "0.5"
        - name: METRICS_EXPORT_INTERVAL_MS
          value: "5000"
        - name: MIN_DURATION_MS
          value: "10"
        - name: MAX_DURATION_MS
          value: "500"
        volumeMounts:
        - name: script
          mountPath: /scripts
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
      volumes:
      - name: script
        configMap:
          name: otel-generator-script