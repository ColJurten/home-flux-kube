# OpenTelemetry Telemetry Generator - All Signals (Logs, Traces, Metrics)
# Single POD with sidecar containers generating correlated telemetry in native OTLP format
# All containers share the same network namespace and lifecycle
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-telemetrygen
  namespace: signoz-vector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-telemetrygen
  template:
    metadata:
      labels:
        app: otel-telemetrygen
    spec:
      containers:
      # Trace generator
      - name: tracegen
        image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.96.0
        args:
          - traces
          - --otlp-endpoint=otel-collector:4317
          - --otlp-insecure
          - --rate=2
          - --duration=0
          - --otlp-attributes=service.name="demo-service"
          - --otlp-attributes=k8s.namespace="signoz-vector"
          - --otlp-attributes=environment="dev"
        resources:
          limits:
            cpu: "50m"
            memory: "32Mi"
      # Metrics generator
      - name: metricgen
        image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.96.0
        args:
          - metrics
          - --otlp-endpoint=otel-collector:4317
          - --otlp-insecure
          - --rate=1
          - --duration=0
          - --otlp-attributes=service.name="demo-service"
          - --otlp-attributes=k8s.namespace="signoz-vector"
          - --otlp-attributes=environment="dev"
        resources:
          limits:
            cpu: "50m"
            memory: "32Mi"
      # Logs generator
      - name: loggen
        image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.96.0
        args:
          - logs
          - --otlp-endpoint=otel-collector:4317
          - --otlp-insecure
          - --rate=2
          - --duration=0
          - --otlp-attributes=service.name="demo-service"
          - --otlp-attributes=k8s.namespace="signoz-vector"
          - --otlp-attributes=environment="dev"
        resources:
          limits:
            cpu: "50m"
            memory: "32Mi"