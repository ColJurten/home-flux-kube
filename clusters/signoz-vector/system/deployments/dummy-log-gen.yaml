# OpenTelemetry Telemetry Generator - All Signals (Logs, Traces, Metrics)
# Single container generating correlated telemetry in native OTLP format
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-telemetrygen
  namespace: signoz-vector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-telemetrygen
  template:
    metadata:
      labels:
        app: otel-telemetrygen
    spec:
      containers:
      - name: telemetrygen
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            # Download telemetrygen binary
            apk add --no-cache curl
            curl -L -o /usr/local/bin/telemetrygen \
              https://github.com/open-telemetry/opentelemetry-collector-contrib/releases/download/v0.144.0/telemetrygen_0.144.0_linux_amd64
            chmod +x /usr/local/bin/telemetrygen
            
            # Start trace generator in background
            /usr/local/bin/telemetrygen traces \
              --otlp-endpoint=otel-collector:4317 \
              --otlp-insecure \
              --rate=2 \
              --duration=0 \
              --otlp-attributes=service.name="demo-service" \
              --otlp-attributes=k8s.namespace="signoz-vector" \
              --otlp-attributes=environment="dev" &
            
            # Start metrics generator in background
            /usr/local/bin/telemetrygen metrics \
              --otlp-endpoint=otel-collector:4317 \
              --otlp-insecure \
              --rate=1 \
              --duration=0 \
              --otlp-attributes=service.name="demo-service" \
              --otlp-attributes=k8s.namespace="signoz-vector" \
              --otlp-attributes=environment="dev" &
            
            # Start logs generator in foreground (keeps container alive)
            /usr/local/bin/telemetrygen logs \
              --otlp-endpoint=otel-collector:4317 \
              --otlp-insecure \
              --rate=2 \
              --duration=0 \
              --otlp-attributes=service.name="demo-service" \
              --otlp-attributes=k8s.namespace="signoz-vector" \
              --otlp-attributes=environment="dev"
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"