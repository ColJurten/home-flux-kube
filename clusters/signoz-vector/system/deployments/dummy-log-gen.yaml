# OpenTelemetry Telemetry Generator - All Signals (Logs, Traces, Metrics)
# Single container generating correlated telemetry in native OTLP format
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-telemetrygen
  namespace: signoz-vector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-telemetrygen
  template:
    metadata:
      labels:
        app: otel-telemetrygen
    spec:
      containers:
      - name: telemetrygen
        image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.144.0
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Start trace generator in background
            /telemetrygen traces \
              --otlp-endpoint=otel-collector:4317 \
              --otlp-insecure \
              --rate=2 \
              --duration=0 \
              --otlp-attributes=service.name="demo-service" \
              --otlp-attributes=k8s.namespace="signoz-vector" \
              --otlp-attributes=environment="dev" &
            
            # Start metrics generator in background
            /telemetrygen metrics \
              --otlp-endpoint=otel-collector:4317 \
              --otlp-insecure \
              --rate=1 \
              --duration=0 \
              --otlp-attributes=service.name="demo-service" \
              --otlp-attributes=k8s.namespace="signoz-vector" \
              --otlp-attributes=environment="dev" &
            
            # Start logs generator in foreground (keeps container alive)
            /telemetrygen logs \
              --otlp-endpoint=otel-collector:4317 \
              --otlp-insecure \
              --rate=2 \
              --duration=0 \
              --otlp-attributes=service.name="demo-service" \
              --otlp-attributes=k8s.namespace="signoz-vector" \
              --otlp-attributes=environment="dev"
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"