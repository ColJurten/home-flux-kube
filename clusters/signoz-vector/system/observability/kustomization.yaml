apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: signoz-vector

resources:
- helm/helmrepo.yaml
- helm/helmrelease.yaml
- deamonset/vector-daemonset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: otel-collector-values
  files:
  - values.yaml=values/otel-collector.yaml
- name: jaeger-values
  files:
  - values.yaml=values/jaeger.yaml
- name: victoriametrics-values
  files:
  - values.yaml=values/victoriametrics.yaml