apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: signoz-vector
spec:
  interval: 1m
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.144.0
      sourceRef:
        kind: HelmRepository
        name: otel-collector-repo
  valuesFrom:
    - kind: ConfigMap
      name: otel-collector-values
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: jaeger
  namespace: signoz-vector
spec:
  interval: 1m
  chart:
    spec:
      chart: jaeger
      version: 4.4.5
      sourceRef:
        kind: HelmRepository
        name: jaeger-repo
  valuesFrom:
    - kind: ConfigMap
      name: jaeger-values
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: signoz-vector
spec:
  interval: 1m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.45.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics-repo
  valuesFrom:
    - kind: ConfigMap
      name: victoriametrics-values
---